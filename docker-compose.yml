services:
  # ── MySQL Database ─────────────────────────────────────────────────────────
  db:
    image: mysql:8.4
    container_name: expensetracker_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-expensetracker}
      MYSQL_USER: ${MYSQL_USER:-expenseuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-${MYSQL_PASSWORD}}
    ports:
      - "127.0.0.1:3307:3306"          # bound to localhost only; not exposed publicly
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - expensetracker_net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Django Backend ─────────────────────────────────────────────────────────
  web:
    image: ${WEB_IMAGE:-moneymatrix-api:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: expensetracker_web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      USE_MYSQL: "True"
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
    ports:
      - "127.0.0.1:8000:8000"          # bound to localhost; public traffic routed via nginx
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/health\")' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - media_files:/app/media
      - static_files:/app/staticfiles
      - ./push_notification/exp-track-7420b-firebase-adminsdk-fbsvc-c382745706.json:/app/push_notification/exp-track-7420b-firebase-adminsdk-fbsvc-c382745706.json:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - expensetracker_net

  # ── Nginx Reverse Proxy ────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: expensetracker_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/app/staticfiles:ro
      - media_files:/app/media:ro
    depends_on:
      - web
    networks:
      - expensetracker_net

volumes:
  mysql_data:
    driver: local
  media_files:
    driver: local
  static_files:
    driver: local

networks:
  expensetracker_net:
    driver: bridge
