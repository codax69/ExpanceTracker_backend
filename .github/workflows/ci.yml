name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  IMAGE_NAME: "moneymatrix-api" # 15 chars (must be <= 20 chars)

jobs:
  lint-and-security:
    name: Lint & Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Lint & Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit

      - name: Run Ruff Lint
        run: ruff check .

      - name: Run Ruff Format Check
        run: ruff format --check .

      - name: Run Bandit Security Scan
        run: bandit -c pyproject.toml -r .

  test:
    name: Django Tests & Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev pkg-config
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django System Checks
        env:
          DJANGO_SECRET_KEY: ci-temporary-secret-key-for-checks-only
          DEBUG: "True"
          USE_MYSQL: "False"
        run: |
          python manage.py check

      - name: Run Django Tests
        env:
          DJANGO_SECRET_KEY: ci-temporary-secret-key-for-checks-only
          DEBUG: "True"
          USE_MYSQL: "False"
        run: |
          python manage.py test

  build-and-push:
    name: Build & Push Image to GHCR
    needs: [lint-and-security, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      repo_owner: ${{ steps.owner.outputs.lowercase }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set lower case owner name
        id: owner
        run: echo "lowercase=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.owner.outputs.lowercase }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production
    needs: [build-and-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH || '/var/www/expensetracker' }}
            git pull origin main
            
            IMAGE="ghcr.io/${{ needs.build-and-push.outputs.repo_owner }}/${{ env.IMAGE_NAME }}:latest"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin || true
            docker pull "$IMAGE"
            
            WEB_IMAGE="$IMAGE" docker compose up -d --no-build
            docker image prune -f

